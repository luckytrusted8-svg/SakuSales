<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sakugrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BE07A" />
      <stop offset="100%" stop-color="#1EB6E6" />
    </linearGradient>
    <filter id="softshadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1EB6E6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Box -->
  <rect x="64" y="32" width="384" height="384" rx="96" ry="96" fill="#FFFFFF" stroke="url(#sakugrad)" stroke-width="24" filter="url(#softshadow)" />

  <!-- Stylized S with Price Tag & Growth Arrow -->
  <g transform="translate(136, 100)">
    <!-- Tag Head Hole -->
    <circle cx="170" cy="55" r="14" fill="url(#sakugrad)" />
    
    <!-- Path forming the Saku & Tag ribbon -->
    <path d="M 120 40 L 160 40 C 185 40 205 60 205 85 L 205 105 C 205 125 190 142 170 145 L 80 160 C 55 164 35 185 35 210 C 35 240 60 264 90 264 L 160 264 C 190 264 215 240 215 210 L 215 170" 
          fill="none" stroke="url(#sakugrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Rising Chart Arrow through the S -->
    <path d="M 35 160 L 85 105 L 140 145 L 205 60" 
          fill="none" stroke="url(#sakugrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow Head -->
    <polygon points="180,50 215,50 215,85" fill="#7BE07A" />
  </g>

  <!-- Typography: SakuSales -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#0F2747" letter-spacing="-0.5">SakuSales</text>
  <text x="256" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#6B7280" letter-spacing="0.2">Jualan &amp; Pencatatan Cepat</text>
</svg>
