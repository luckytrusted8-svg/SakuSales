name: sakusales
description: "SakuSales - Jualan & Pencatatan Cepat"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase (Auth, DB, Realtime, RPC)
  supabase_flutter: ^2.8.4

  # Push Notification
  onesignal_flutter: ^5.3.3

  # Fonts & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # State Management
  flutter_riverpod: ^2.6.1

  # Audio & Sharing
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icon/
    - logo-sakusales.svg
